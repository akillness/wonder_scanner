<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system,Segoe UI,Pretendard,sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b95ad"/></marker></defs>
  <rect width="900" height="420" rx="20" fill="#0b0f1a"/>
  <text x="450" y="32" text-anchor="middle" fill="#e8ecf5" font-size="18" font-weight="800">구조 — 기기 안에서 끝나고, 클라우드는 선택</text>
  <rect x="24" y="52" width="560" height="340" rx="18" fill="#0f1626" stroke="#6ee7ff" stroke-dasharray="6 4"/><text x="44" y="76" fill="#6ee7ff" font-weight="700">📱 사용자 기기 (정적 웹, 서버 호출 없음)</text>
  <g fill="#e8ecf5" text-anchor="middle">
    <rect x="44" y="96" width="150" height="60" rx="12" fill="#121a2b" stroke="#2a3350"/><text x="119" y="121" font-weight="700">카메라 / 사진</text><text x="119" y="139" fill="#8b95ad">getUserMedia · 파일</text>
    <rect x="44" y="176" width="150" height="60" rx="12" fill="#121a2b" stroke="#2a3350"/><text x="119" y="201" font-weight="700">자이로</text><text x="119" y="219" fill="#8b95ad">DeviceOrientation 3-DoF</text>
    <rect x="224" y="96" width="160" height="60" rx="12" fill="#121a2b" stroke="#FF6F00"/><text x="304" y="121" font-weight="700">TensorFlow.js</text><text x="304" y="139" fill="#8b95ad">COCO-SSD lite · WebGL</text>
    <rect x="224" y="176" width="160" height="60" rx="12" fill="#121a2b" stroke="#7cf59a"/><text x="304" y="201" font-weight="700">AR 오버레이</text><text x="304" y="219" fill="#8b95ad">브래킷·오라·정령·포획 링</text>
    <rect x="224" y="256" width="160" height="60" rx="12" fill="#121a2b" stroke="#ffd166"/><text x="304" y="281" font-weight="700">게임 로직</text><text x="304" y="299" fill="#8b95ad">balance·state·quests·economy</text>
    <rect x="414" y="96" width="150" height="60" rx="12" fill="#121a2b" stroke="#d29bff"/><text x="489" y="121" font-weight="700">녹화기</text><text x="489" y="139" fill="#8b95ad">MediaRecorder + 사운드 믹스</text>
    <rect x="414" y="176" width="150" height="60" rx="12" fill="#121a2b" stroke="#a78bfa"/><text x="489" y="201" font-weight="700">추억 앨범</text><text x="489" y="219" fill="#8b95ad">IndexedDB · 압축 · 진화</text>
    <rect x="414" y="256" width="150" height="60" rx="12" fill="#121a2b" stroke="#8fd3ff"/><text x="489" y="281" font-weight="700">저장</text><text x="489" y="299" fill="#8b95ad">localStorage 1키 (v3)</text>
    <rect x="44" y="330" width="520" height="44" rx="12" fill="#1a2338" stroke="#2a3350"/><text x="304" y="357" fill="#c9d1e3">화면: 타이틀 · 스캔 · 발견 · 도감 · 앨범 · 의뢰 · 상점 · 프로필 · 광장  (shell.js 라우터 + 하단 탭)</text>
  </g>
  <g stroke="#8b95ad" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M194 126H222"/><path d="M194 206H222"/><path d="M384 126H412"/><path d="M304 156V174"/><path d="M304 236V254"/><path d="M384 286H412"/><path d="M489 156V174"/><path d="M489 236V254"/></g>
  <rect x="616" y="52" width="260" height="340" rx="18" fill="#0f1626" stroke="#ffd166" stroke-dasharray="6 4"/><text x="636" y="76" fill="#ffd166" font-weight="700">☁️ 선택: Firebase (환경변수로 켬)</text>
  <g fill="#e8ecf5" text-anchor="middle">
    <rect x="636" y="96" width="220" height="56" rx="12" fill="#121a2b" stroke="#2a3350"/><text x="746" y="120" font-weight="700">Google 로그인</text><text x="746" y="138" fill="#8b95ad">Auth popup</text>
    <rect x="636" y="168" width="220" height="56" rx="12" fill="#121a2b" stroke="#2a3350"/><text x="746" y="192" font-weight="700">Storage</text><text x="746" y="210" fill="#8b95ad">users/{uid}/moments/*.jpg · .mp4</text>
    <rect x="636" y="240" width="220" height="56" rx="12" fill="#121a2b" stroke="#2a3350"/><text x="746" y="264" font-weight="700">Firestore</text><text x="746" y="282" fill="#8b95ad">collectors/{uid} · moments · saves</text>
    <rect x="636" y="312" width="220" height="56" rx="12" fill="#121a2b" stroke="#2a3350"/><text x="746" y="336" font-weight="700">탐험가 광장</text><text x="746" y="354" fill="#8b95ad">공개 컬렉터 · 추억 둘러보기</text>
  </g>
  <path d="M584 206 H614" stroke="#ffd166" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text x="450" y="410" text-anchor="middle" fill="#8b95ad" font-size="11">Vercel은 HTML/JS/CSS만 제공. 카메라 프레임은 기기 밖으로 나가지 않으며, 클라우드 업로드는 로그인한 사용자의 앨범 사진·클립만.</text>
</svg>
