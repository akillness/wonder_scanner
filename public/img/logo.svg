<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Wonder Scanner mark: brass aperture ring on an ink plate (DESIGN.md §8) -->
  <defs>
    <radialGradient id="ws-lens" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#6DB5A0"/>
      <stop offset="1" stop-color="#0F141E"/>
    </radialGradient>
  </defs>
  <!-- ink plate + hairline -->
  <rect x=".5" y=".5" width="127" height="127" rx="30" fill="#161D2B" stroke="#EDE6D6" stroke-opacity=".1"/>
  <!-- six blade hint lines (iris), tangent to the lens -->
  <g stroke="#E2B45A" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M64 40h24"/>
    <path d="M84.8 52l12 20.8"/>
    <path d="M84.8 76l-12 20.8"/>
    <path d="M64 88H40"/>
    <path d="M43.2 76l-12-20.8"/>
    <path d="M43.2 52l12-20.8"/>
  </g>
  <!-- center lens: verdigris to ink -->
  <circle cx="64" cy="64" r="20" fill="url(#ws-lens)"/>
  <ellipse cx="57" cy="56" rx="5" ry="3" fill="#EDE6D6" opacity=".3" transform="rotate(-30 57 56)"/>
  <!-- aperture ring, outer radius 40 -->
  <circle cx="64" cy="64" r="37.5" fill="none" stroke="#E2B45A" stroke-width="5"/>
  <!-- four cardinal ticks -->
  <path d="M64 14v7M64 107v7M14 64h7M107 64h7" fill="none" stroke="#E2B45A" stroke-width="4" stroke-linecap="round"/>
  <!-- single four-point sparkle, top right -->
  <path d="M101 17l2.6 5.4 5.4 2.6-5.4 2.6-2.6 5.4-2.6-5.4-5.4-2.6 5.4-2.6z" fill="#E2B45A"/>
</svg>
