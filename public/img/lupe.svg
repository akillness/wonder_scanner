<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Lupe, the lens spirit: frosted bone orb with a brass monocle (DESIGN.md §8) -->
  <defs>
    <radialGradient id="lupe-body" cx="40%" cy="34%" r="72%">
      <stop offset="0" stop-color="#EDE6D6"/>
      <stop offset=".5" stop-color="#EDE6D6"/>
      <stop offset="1" stop-color="#6DB5A0"/>
    </radialGradient>
    <radialGradient id="lupe-lens" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#6DB5A0"/>
      <stop offset="1" stop-color="#0F141E"/>
    </radialGradient>
  </defs>
  <!-- tail: verdigris wisp -->
  <path d="M60 108C50 100 45 91 51 84c4 6 9 8 9 8s5-2 9-8c6 7 1 16-9 24z" fill="#6DB5A0" opacity=".7"/>
  <!-- body: frosted bone orb -->
  <circle cx="60" cy="58" r="36" fill="url(#lupe-body)" stroke="#CFC7B4" stroke-width="1.5"/>
  <ellipse cx="46" cy="40" rx="10" ry="6" fill="#EDE6D6" opacity=".8" transform="rotate(-20 46 40)"/>
  <!-- left eye: ink oval + highlight -->
  <ellipse cx="48" cy="60" rx="6" ry="8" fill="#0F141E"/>
  <circle cx="50" cy="57" r="2.2" fill="#EDE6D6"/>
  <!-- right eye: brass monocle -->
  <circle cx="74" cy="60" r="12" fill="url(#lupe-lens)" stroke="#E2B45A" stroke-width="3.5"/>
  <circle cx="74" cy="60" r="4.5" fill="#0F141E"/>
  <circle cx="76" cy="58" r="1.6" fill="#EDE6D6"/>
  <!-- monocle chain: two brass links -->
  <g fill="none" stroke="#E2B45A" stroke-width="2" stroke-linecap="round">
    <path d="M82.5 68.5l2.2 2.6"/>
    <circle cx="87" cy="74" r="3"/>
    <circle cx="90.5" cy="80" r="3"/>
  </g>
  <!-- mouth -->
  <path d="M54 74q6 5 12 0" fill="none" stroke="#0F141E" stroke-width="2.4" stroke-linecap="round"/>
  <!-- cheeks: prism rose, 40% -->
  <circle cx="42" cy="70" r="3.5" fill="#E39BC0" opacity=".4"/>
  <circle cx="66" cy="73" r="2.5" fill="#E39BC0" opacity=".4"/>
  <!-- one brass sparkle -->
  <path d="M97 22l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#E2B45A"/>
</svg>
